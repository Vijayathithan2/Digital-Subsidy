spring.application.name=government-subsidy-system-test
server.port=0

# H2 Database in MySQL Mode
spring.datasource.url=jdbc:h2:mem:subsidy_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable automatic SQL script initialization (Hibernate manages schema)
spring.sql.init.mode=never

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Security
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# File Upload
app.upload.dir=target/test-uploads
app.scheduling.enabled=false
